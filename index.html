<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171327">
  <meta name="description" content="カメラに妖怪が現れる！3〜5匹の妖怪が飛び回る、AR風の写真アプリ。">
  <title>ようかいカメラ — ふしぎな世界をパシャッ！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="experience" id="experience">
    <div class="scene" id="scene" aria-label="カメラ映像に妖怪が重なるプレビュー">
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
      <div class="demo-backdrop" id="demoBackdrop" aria-hidden="true">
        <div class="moon"></div><div class="hill hill-one"></div><div class="hill hill-two"></div>
        <div class="demo-caption">ようかいが あらわれる ふしぎなせかい</div>
      </div>
      <canvas id="yokaiCanvas" aria-hidden="true"></canvas>
      <div class="scene-vignette" aria-hidden="true"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">妖</span>
        <div>
          <span class="brand-kicker">YOKAI PHOTO STUDIO</span>
          <h1>ようかいカメラ</h1>
        </div>
      </div>
      <div class="status" id="cameraStatus"><span class="status-dot"></span><span id="cameraStatusText">デモ表示中</span></div>
    </header>

    <div class="upper-actions"><div class="guide-pill" id="guidePill">妖怪たちが あちこちに とびまわるよ！</div></div>
    <div class="recording-indicator" id="recordingIndicator" hidden><span class="recording-dot"></span> REC <span id="recordingTime">00:00</span></div>

    <div class="skill-message" id="skillMessage" aria-live="off"></div>

    <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
      <div class="welcome-symbol">✦</div>
      <p class="welcome-overline">まほうのカメラ</p>
      <h2 id="welcomeTitle">いつもの景色に<br><span>ようかいが やってくる！</span></h2>
      <p class="welcome-description">カメラをむけると、妖怪たちがふわふわ飛び回るよ。写真も動画も撮れるよ！</p>
      <button type="button" class="start-camera" id="startCamera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
        カメラをはじめる
      </button>
      <button type="button" class="demo-link" id="watchDemo">まずはデモであそぶ</button>
      <p class="privacy-note">カメラ映像はこの端末の中だけで使います。<br>サーバーへの送信はしません。</p>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="control-dock">
      <div class="capture-modes" role="group" aria-label="撮影モード">
        <button type="button" data-mode="photo" aria-pressed="true">写真</button>
        <button type="button" data-mode="video" aria-pressed="false">ビデオ</button>
      </div>
      <div class="camera-row">
        <button type="button" class="shuffle-button" id="shuffle" aria-label="妖怪をランダムに入れ替える">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c5 0 6 10 12 10h3M18 14l3 3-3 3M3 17h3c2 0 3-2 4-4M14 8c1-1 2-1 4-1h3M18 4l3 3-3 3"/></svg>
          いれかえ
        </button>
        <button type="button" class="shutter" id="shutter" aria-label="写真を撮影する" title="写真を撮る" disabled><span></span></button>
        <div class="right-camera-actions">
          <button type="button" class="flip-button" id="flipCamera" aria-label="前面・背面カメラを切り替える" title="カメラ切り替え" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5h3M21 16v3h-3M4.8 12a7.5 7.5 0 0 1 12.5-5.5L21 10M19.2 12a7.5 7.5 0 0 1-12.5 5.5L3 14"/></svg>
          </button>
          <button type="button" class="camera-retry" id="cameraRetry">カメラを<br>起動する</button>
        </div>
      </div>
      <p class="dock-footnote" id="cameraHint">✦ 3〜5匹が自由に飛び、ときどき技を出すよ</p>
    </footer>

    <section class="photo-review" id="photoReview" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
      <div class="photo-head"><h2 id="reviewTitle">とれたよ！ <span>📸</span></h2><button type="button" id="closeReview" aria-label="写真を閉じる">×</button></div>
      <div class="photo-frame"><img id="capturedPhoto" alt="撮影した妖怪の写真"><video id="capturedVideo" controls playsinline aria-label="撮影した妖怪の動画" hidden></video></div>
      <a class="save-photo" id="savePhoto" download="yokai-camera.png">写真を保存する <span aria-hidden="true">↓</span></a>
      <p id="reviewNote">写真は端末に保存されるよ</p>
    </section>

    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
