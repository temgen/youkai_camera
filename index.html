<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171327">
  <meta name="description" content="好きな妖怪を選んで、カメラと一緒に写真や動画を撮影できるAR風カメラアプリ。">
  <title>ようかいカメラ — ふしぎな世界をパシャッ！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="experience" id="experience">
    <div class="scene" id="scene" aria-label="カメラ映像に妖怪が重なるプレビュー">
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
      <div class="demo-backdrop" id="demoBackdrop" aria-hidden="true">
        <div class="moon"></div><div class="hill hill-one"></div><div class="hill hill-two"></div>
      </div>
      <canvas id="yokaiCanvas" aria-hidden="true"></canvas>
      <div class="scene-vignette" aria-hidden="true"></div>
    </div>

    <div class="status sr-only" id="cameraStatus"><span id="cameraStatusText">デモ表示中</span></div>
    <div class="recording-indicator" id="recordingIndicator" hidden aria-label="録画中"><span class="recording-dot"></span><span id="recordingTime" class="sr-only">00:00</span></div>
    <div class="skill-message sr-only" id="skillMessage" aria-live="off"></div>

    <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
      <h2 id="welcomeTitle" class="sr-only">登場させる妖怪を選ぶ</h2>
      <button type="button" class="selector-close" id="closeSelector" aria-label="妖怪選択を閉じる" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
      <div class="lineup-grid" id="lineupGrid" role="group" aria-label="登場する妖怪を選択。選択した妖怪は1種類につき1匹"></div>
      <div class="launch-actions" id="launchActions">
        <button type="button" class="start-camera" id="startCamera" aria-label="選んだ妖怪でカメラを開始する" title="カメラを開始する">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </button>
        <button type="button" class="demo-link" id="watchDemo" aria-label="選んだ妖怪でデモを表示する" title="デモを表示する">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
        </button>
      </div>
    </section>

    <div class="toast sr-only" id="toast" role="status" aria-live="polite"></div>

    <footer class="control-dock">
      <div class="capture-modes" role="group" aria-label="撮影モード">
        <button type="button" data-mode="photo" aria-pressed="true" aria-label="写真モード" title="写真モード"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
        <button type="button" data-mode="video" aria-pressed="false" aria-label="ビデオモード" title="ビデオモード"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg></button>
      </div>
      <div class="camera-row">
        <button type="button" class="shuffle-button" id="shuffle" aria-label="登場する妖怪を選び直す" title="妖怪を選ぶ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button type="button" class="shutter" id="shutter" aria-label="写真を撮影する" title="写真を撮る" disabled><span></span></button>
        <div class="right-camera-actions">
          <button type="button" class="flip-button" id="flipCamera" aria-label="前面・背面カメラを切り替える" title="カメラ切り替え" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5h3M21 16v3h-3M4.8 12a7.5 7.5 0 0 1 12.5-5.5L21 10M19.2 12a7.5 7.5 0 0 1-12.5 5.5L3 14"/></svg>
          </button>
          <button type="button" class="camera-retry" id="cameraRetry" aria-label="カメラを起動する" title="カメラを起動する"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
        </div>
      </div>
      <p class="dock-footnote sr-only" id="cameraHint"></p>
    </footer>

    <section class="photo-review" id="photoReview" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
      <div class="photo-head"><h2 id="reviewTitle" class="sr-only">撮影結果</h2><button type="button" id="closeReview" aria-label="撮影結果を閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
      <div class="photo-frame"><img id="capturedPhoto" alt="撮影した妖怪の写真"><video id="capturedVideo" controls playsinline aria-label="撮影した妖怪の動画" hidden></video></div>
      <div class="review-actions">
        <button type="button" class="save-photo" id="savePhoto" aria-label="共有メニューを開いて写真アプリに保存する" title="写真アプリに保存する">
          <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V2m-5 5 5-5 5 5M5 12v9h14v-9"/></svg>
          <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>
        </button>
        <a class="download-photo" id="downloadPhoto" download="yokai-camera.png" aria-label="ファイルとしてダウンロードする" title="ファイルに保存する"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></a>
      </div>
      <p id="reviewNote" class="sr-only"></p>
    </section>

    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
